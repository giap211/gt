name: Import RoPhim source

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  extract:
    if: "!contains(github.event.head_commit.message, 'Extract RoPhim source')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Extract the supplied project archive
        shell: bash
        run: |
          set -euo pipefail
          test -f rophim-main.zip
          mkdir -p "$RUNNER_TEMP/rophim-import"
          unzip -q rophim-main.zip -d "$RUNNER_TEMP/rophim-import"
          test -d "$RUNNER_TEMP/rophim-import/rophim-main"
          cp -a "$RUNNER_TEMP/rophim-import/rophim-main/." .
          rm -f rophim-main.zip
          rm -f .github/workflows/extract-archive.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Extract RoPhim source and remove uploaded archive"
          git push origin HEAD:main
