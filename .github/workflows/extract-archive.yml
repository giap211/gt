name: Extract RoPhim archive

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/extract-archive.yml

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Extract project files
        shell: bash
        run: |
          set -euo pipefail
          test -f rophim-main.zip
          mkdir -p "$RUNNER_TEMP/rophim-import"
          unzip -q rophim-main.zip -d "$RUNNER_TEMP/rophim-import"
          test -d "$RUNNER_TEMP/rophim-import/rophim-main"
          cp -a "$RUNNER_TEMP/rophim-import/rophim-main/." .
          rm -f .github/workflows/extract-archive.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No extracted changes to commit."
            exit 0
          fi
          git commit -m "Extract RoPhim source into repository"
          git push origin HEAD:main
